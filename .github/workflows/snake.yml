name: Generate Snake Animation

on:
  # Каждые 12 часов
  schedule:
    - cron: "0 */12 * * *"
  # Ручной запуск из вкладки Actions
  workflow_dispatch:
  # При пуше в main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Aurora: teal -> cyan -> violet -> pink
          outputs: |
            dist/snake.svg?color_snake=#8B5CF6&color_dots=#eef6f8,#a5f3fc,#22D3EE,#8B5CF6,#EC4899
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#0e7490,#22D3EE,#8B5CF6,#EC4899

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
