name: Generate Snake Animation

on:
  # Запуск по расписанию — каждые 12 часов
  schedule:
    - cron: "0 */12 * * *"
  # Ручной запуск из вкладки Actions
  workflow_dispatch:
  # Запуск при пуше в main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#1e1b4b,#4c1d95,#7c3aed,#a78bfa,#ede9fe

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
